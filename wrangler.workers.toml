# Wrangler config used ONLY by the `test:workers` vitest pool — it pins a
# real `workerd` runtime around the `SessionSupervisorDO` so the DO host is
# exercised under actual Cloudflare semantics (real DurableObjectState, real
# ReadableStream, real Response). Not a deployable Worker.

name = "agent-runtime-workers-tests"
main = "tests/workers/entry.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "SESSION_SUPERVISOR"
class_name = "TestSessionSupervisor"

[[migrations]]
tag = "v1"
new_classes = ["TestSessionSupervisor"]
