  - 'typescript@7.0.2'
  - 'yaml@2.9.1'
  - 'zod@4.6.7'
minimumReleaseAgeIgnoreMissingTime: false
# Miniflare pins older HTTP/image dependencies in both stable and beta tools.
# Patch each affected major without moving Miniflare across its release channel.
