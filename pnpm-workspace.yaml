packages:
  - bench

strictPeerDependencies: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@tangle-network/*'
  - '@hono/node-server@2.0.12'
  - 'hono@4.12.32'
  - 'playwright@1.62.0'
  - 'playwright-core@1.62.0'
  - 'rolldown-plugin-dts@0.27.14'
  - 'zod@4.6.5'
minimumReleaseAgeIgnoreMissingTime: false
allowBuilds:
  '@ax-llm/ax': false
  esbuild: true
  workerd: true

catalog:
  '@arethetypeswrong/cli': 0.18.5
  '@modelcontextprotocol/sdk': 1.30.0
  '@tangle-network/agent-core': '>=0.10.2 <0.11.0'
  '@types/node': 26.4.0
  '@tangle-network/agent-eval': '>=0.203.0 <0.206.0'
  '@tangle-network/agent-interface': '^2.19.0'
  '@tangle-network/agent-knowledge': ^19.0.1
  '@tangle-network/agent-profile-materialize': '>=0.20.1 <0.21.0'
  '@tangle-network/agent-trace-contract': ^2.0.0
  '@tangle-network/sandbox': '^0.60.0'
  publint: 0.3.24
  tsdown: 0.22.14
  tsx: 4.23.12
  zod: 4.6.5
  # TypeDoc 0.28.20 and the repository's AST-based test helpers require the
  # compiler API that TypeScript 7 removes. The packed-consumer check below
  # keeps an exact TypeScript 7.0.2 alias for consumer compatibility proof.
  typescript: 6.0.3
