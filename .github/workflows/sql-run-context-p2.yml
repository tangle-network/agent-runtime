name: SQL run context p2 conformance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/sql-run-context-p2.yml'
permissions:
  contents: read
jobs:
  conformance:
    if: github.head_ref == 'pro/sql-run-context/p2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Capture exact source for offline reproduction
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/sql-p2-source.tgz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sql-p2-source
          path: /tmp/sql-p2-source.tgz
          retention-days: 1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture locked dependencies (no repository or credential files)
        run: |
          npm pack pnpm@11.17.0 --pack-destination /tmp
          tar -czf /tmp/sql-p2-deps.tgz node_modules bench/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sql-p2-deps
          path: |
            /tmp/sql-p2-deps.tgz
            /tmp/pnpm-11.17.0.tgz
          retention-days: 1
          compression-level: 0
      - name: SQL kill and resume conformance
        run: pnpm exec vitest run tests/durability/sql-run-context.test.ts tests/durability/sql-graph-kill-resume.test.ts
