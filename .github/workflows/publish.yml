name: Publish

on:
  push:
    tags:
      - 'v*'
      - 'agent-bench-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to retry
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.release.outputs.version }}
      package-sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Read exact first-party cohort
        id: cohort
        run: node scripts/release-cohort.mjs --github-output "$GITHUB_OUTPUT"

      - name: Verify release source and version
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]] ||
             ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Expected an existing v* release tag, got '$RELEASE_TAG'."
            exit 1
          fi
          git fetch --force --no-tags --depth=1 origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_SHA=$(git rev-parse "$RELEASE_TAG^{}")
          CHECKOUT_SHA=$(git rev-parse HEAD)
          if [ "$CHECKOUT_SHA" != "$TAG_SHA" ]; then
            echo "::error::Checkout $CHECKOUT_SHA does not match $RELEASE_TAG at $TAG_SHA."
            exit 1
          fi
          NPM_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag/version mismatch: tag=$TAG_VERSION package=$NPM_VERSION."
            exit 1
          fi
          echo "version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release source locked: $RELEASE_TAG at $TAG_SHA"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.32'

      # A release tag must sit on the tip of the line it releases. Without this, a
      # tag cut from an older commit publishes while newer merged commits are
      # silently excluded: 0.106.0 was tagged at the #624 merge and published 45
      # minutes before #626 merged, so the parallel-tool-call fix never reached the
      # registry even though it was already on main. Nothing failed — `latest`
      # simply did not contain the code main had.
      #
      # A tag is valid at the tip of `main` (normal release) or at the tip of a
      # `release/<major>.<minor>.x` branch (backport onto a line the fleet still
      # resolves — 0.x caret ranges only admit patches, so this is the only way to
      # ship a fix to a consumer pinned to an older minor). Comparing SHAs needs no
      # shared history, so a shallow fetch is sufficient.
      - name: Verify tag is the tip of its release line
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          git fetch --no-tags --depth=100 origin +refs/heads/main:refs/remotes/origin/main
          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          if [ "$TAG_SHA" = "$MAIN_SHA" ]; then
            echo "Tag is the tip of main: $TAG_SHA"
            exit 0
          fi
          VERSION="${RELEASE_TAG#v}"
          LINE="release/${VERSION%.*}.x"
          if git fetch --no-tags --depth=100 origin "+refs/heads/$LINE:refs/remotes/origin/$LINE" 2>/dev/null; then
            LINE_SHA=$(git rev-parse "refs/remotes/origin/$LINE")
            if [ "$TAG_SHA" = "$LINE_SHA" ]; then
              echo "Tag is the tip of $LINE: $TAG_SHA"
              exit 0
            fi
            echo "::error::Tag v$VERSION is at $TAG_SHA but $LINE is at $LINE_SHA."
            echo "Commits on $LINE this tag would NOT publish:"
            git log --oneline "$TAG_SHA".."$LINE_SHA" || true
            exit 1
          fi
          echo "::error::Tag v$VERSION is at $TAG_SHA, which is neither the tip of main ($MAIN_SHA) nor of $LINE (no such branch)."
          echo "Commits on main this tag would NOT publish:"
          git log --oneline "$TAG_SHA".."$MAIN_SHA" || true
          echo "Re-cut the tag at the tip of main, or push a $LINE branch for a backport."
          exit 1

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Typecheck (src + examples; examples resolve against built dist)
        run: pnpm run typecheck

      - name: Verify packed package exports
        run: pnpm run verify:package

      - name: Check out exact Interface release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-sdk
          ref: ${{ steps.cohort.outputs.agent_interface_ref }}
          path: .cohort/agent-sdk
          persist-credentials: false

      - name: Check out exact Eval release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-eval
          ref: ${{ steps.cohort.outputs.agent_eval_ref }}
          path: .cohort/agent-eval
          persist-credentials: false

      - name: Check out exact Knowledge release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-knowledge
          ref: ${{ steps.cohort.outputs.agent_knowledge_ref }}
          path: .cohort/agent-knowledge
          persist-credentials: false

      - name: Verify exact Interface, Eval, Knowledge, and Runtime archives together
        run: >-
          node scripts/verify-packed-cohort.mjs
          --agent-interface-repo .cohort/agent-sdk
          --agent-eval-repo .cohort/agent-eval
          --agent-knowledge-repo .cohort/agent-knowledge
          --cohort-manifest release/cohort.json
          --report "$RUNNER_TEMP/cohort-report.json"

      - name: Verify packed Runtime with official GEPA and SkillOpt
        run: pnpm run verify:official-optimizers

      - name: Verify PrimeIntellect package integration
        run: pnpm run verify:primeintellect

      - name: Verify agent-bench against this release
        env:
          AGENT_BENCH_PACKAGE_TEST_TIMEOUT_MS: 900000
        run: pnpm run verify:bench

      - name: Package and verify the exact Runtime archive
        id: package
        run: |
          package_dir="$RUNNER_TEMP/agent-runtime-package"
          mkdir -p "$package_dir"
          npm_config_ignore_scripts=true pnpm pack --pack-destination "$package_dir"
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one Runtime archive, found ${#packages[@]}."
            exit 1
          fi
          package="${packages[0]}"
          node scripts/verify-package-exports.mjs "$package"
          node scripts/verify-edge-tool-loop.mjs "$package"
          sha256=$(sha256sum "$package" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Runtime archive locked: $package ($sha256)"

      # The manifest reports what this exact archive proved about its own durable
      # and control capabilities, so it travels with the archive it describes.
      - name: Emit and verify the conformance manifest for the exact archive
        run: |
          package_dir="$RUNNER_TEMP/agent-runtime-package"
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one Runtime archive, found ${#packages[@]}."
            exit 1
          fi
          manifest="$package_dir/agent-runtime-conformance-manifest.json"
          node scripts/emit-conformance-manifest.mjs \
            --tarball "${packages[0]}" \
            --cohort-report "$RUNNER_TEMP/cohort-report.json" \
            --out "$manifest"
          node scripts/verify-conformance-manifest.mjs "$manifest" \
            --tarball "${packages[0]}" \
            --cohort-report "$RUNNER_TEMP/cohort-report.json" \
            --source-root .

      - name: Upload exact Runtime archive and its conformance manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-runtime-package
          path: |
            ${{ runner.temp }}/agent-runtime-package/*.tgz
            ${{ runner.temp }}/agent-runtime-package/agent-runtime-conformance-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-npm:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_NAME: '@tangle-network/agent-runtime'
      EXPECTED_VERSION: ${{ needs.verify.outputs.release-version }}
      EXPECTED_SHA256: ${{ needs.verify.outputs.package-sha256 }}
      # Attest every publish on both the OIDC path and the token fallback. The
      # `--provenance` flag says the same thing; the variable also covers a
      # publish an npm lifecycle script starts.
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-runtime-package
          path: ${{ runner.temp }}/agent-runtime-package


      # Tokenless by default. NPM_TOKEN is a break-glass fallback for repairing a
      # publish by hand; it is not set, and a token set here TAKES PRECEDENCE over
      # OIDC (agent-sdk #284: a repo token whose package scope missed three
      # packages made every publish 404 on the PUT), so leave it unset.
      - name: Configure npm auth (OIDC by default, token only when set)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # An empty _authToken line also blocks the exchange, which is why this
          # job takes no setup-node registry-url. Drop any such line, then write
          # one back only for a real token.
          sed -i '/_authToken/d' "$HOME/.npmrc" 2>/dev/null || true
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set --location=user //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            echo 'NPM_TOKEN is set: publishing with the token fallback, still attested.'
          else
            echo 'No NPM_TOKEN: publishing through npm trusted publishing (OIDC).'
          fi

      # Node 24.18.0 bundles npm 11.16.0, above the 11.5.1 trusted-publishing
      # floor. This job has no source checkout and runs no dependency or package
      # build, so the bundled CLI is the one that does the OIDC exchange.
      # Requires the npmjs Trusted Publisher: org tangle-network, repo
      # agent-runtime, workflow publish.yml, no environment.
      - name: Publish exact Runtime archive
        run: |
          npm_version=$(npm --version)
          # The OIDC exchange needs npm >= 11.5.1, and npm 12.0.0 ships a
          # provenance publish that fails with MODULE_NOT_FOUND for sigstore, so
          # accept only the 11.x line at or above the floor.
          if [[ "$npm_version" != 11.* ]] ||
             [ "$(printf '%s\n%s\n' 11.5.1 "$npm_version" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::Expected npm >= 11.5.1 and < 12, received $npm_version."
            exit 1
          fi
          mapfile -t packages < <(find "$RUNNER_TEMP/agent-runtime-package" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one Runtime archive, found ${#packages[@]}."
            exit 1
          fi
          package="${packages[0]}"
          actual_sha256=$(sha256sum "$package" | cut -d' ' -f1)
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Runtime archive digest mismatch."
            exit 1
          fi
          manifest=$(tar -xOzf "$package" package/package.json)
          name=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).name)' "$manifest")
          version=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$manifest")
          if [ "$name" != "$EXPECTED_NAME" ] || [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::Runtime archive identity mismatch: $name@$version."
            exit 1
          fi
          if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$version already on registry; skipping publish"
          else
            # npm refuses to implicitly move `latest` to a LOWER version, which is
            # exactly what a backport off release/<major>.<minor>.x is. When this
            # version is not the highest published, publish it under a line-scoped
            # dist-tag instead. Dist-tags do not affect semver range resolution, so
            # a consumer pinned to ^0.84.0 still resolves 0.84.1.
            latest=$(npm view "$name" version --registry=https://registry.npmjs.org 2>/dev/null || true)
            if [ -n "$latest" ] && \
               [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
              line_tag="release-${version%.*}"
              echo "$version is below latest ($latest); publishing under dist-tag $line_tag"
              npm publish "$package" --ignore-scripts --provenance --access public --tag "$line_tag" --registry=https://registry.npmjs.org
            else
              npm publish "$package" --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org
            fi
          fi

  verify-agent-bench:
    # Manual dispatch remains root-only. Re-run a failed bench tag workflow so
    # tag/version locking stays intact and the root package is never co-published.
    if: startsWith(github.ref, 'refs/tags/agent-bench-v')
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.release.outputs.version }}
      package-sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Wait for published agent-bench dependencies
        timeout-minutes: 25
        run: pnpm --filter @tangle-network/agent-bench run wait:published-dependencies

      - name: Verify packed agent-bench against published dependencies
        env:
          AGENT_BENCH_PACKAGE_TEST_TIMEOUT_MS: 900000
        run: pnpm run verify:bench:published

      - name: Verify tag/version lock
        id: release
        run: |
          NPM_VERSION=$(node -p "require('./bench/package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/agent-bench-v}"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag/version mismatch: tag=$TAG_VERSION package=$NPM_VERSION."
            exit 1
          fi
          echo "version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version locked: $NPM_VERSION"

      - name: Package and verify the exact agent-bench archive
        id: package
        run: |
          package_dir="$RUNNER_TEMP/agent-bench-package"
          mkdir -p "$package_dir"
          npm_config_ignore_scripts=true pnpm --dir bench pack --pack-destination "$package_dir"
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one agent-bench archive, found ${#packages[@]}."
            exit 1
          fi
          package="${packages[0]}"
          node bench/scripts/verify-packed-consumer.mjs --tarball "$package"
          sha256=$(sha256sum "$package" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "agent-bench archive locked: $package ($sha256)"

      - name: Upload exact agent-bench archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-bench-package
          path: ${{ runner.temp }}/agent-bench-package/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-agent-bench:
    needs: verify-agent-bench
    if: startsWith(github.ref, 'refs/tags/agent-bench-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_NAME: '@tangle-network/agent-bench'
      EXPECTED_VERSION: ${{ needs.verify-agent-bench.outputs.release-version }}
      EXPECTED_SHA256: ${{ needs.verify-agent-bench.outputs.package-sha256 }}
      # Attest every publish on both the OIDC path and the token fallback. The
      # `--provenance` flag says the same thing; the variable also covers a
      # publish an npm lifecycle script starts.
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-bench-package
          path: ${{ runner.temp }}/agent-bench-package


      # Tokenless by default. NPM_TOKEN is a break-glass fallback for repairing a
      # publish by hand; it is not set, and a token set here TAKES PRECEDENCE over
      # OIDC (agent-sdk #284: a repo token whose package scope missed three
      # packages made every publish 404 on the PUT), so leave it unset.
      - name: Configure npm auth (OIDC by default, token only when set)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # An empty _authToken line also blocks the exchange, which is why this
          # job takes no setup-node registry-url. Drop any such line, then write
          # one back only for a real token.
          sed -i '/_authToken/d' "$HOME/.npmrc" 2>/dev/null || true
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set --location=user //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            echo 'NPM_TOKEN is set: publishing with the token fallback, still attested.'
          else
            echo 'No NPM_TOKEN: publishing through npm trusted publishing (OIDC).'
          fi

      - name: Publish exact agent-bench archive
        run: |
          # Requires the npmjs Trusted Publisher on @tangle-network/agent-bench:
          # org tangle-network, repo agent-runtime, workflow publish.yml, no
          # environment.
          npm_version=$(npm --version)
          # The OIDC exchange needs npm >= 11.5.1, and npm 12.0.0 ships a
          # provenance publish that fails with MODULE_NOT_FOUND for sigstore, so
          # accept only the 11.x line at or above the floor.
          if [[ "$npm_version" != 11.* ]] ||
             [ "$(printf '%s\n%s\n' 11.5.1 "$npm_version" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::Expected npm >= 11.5.1 and < 12, received $npm_version."
            exit 1
          fi
          mapfile -t packages < <(find "$RUNNER_TEMP/agent-bench-package" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one agent-bench archive, found ${#packages[@]}."
            exit 1
          fi
          package="${packages[0]}"
          actual_sha256=$(sha256sum "$package" | cut -d' ' -f1)
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "::error::agent-bench archive digest mismatch."
            exit 1
          fi
          manifest=$(tar -xOzf "$package" package/package.json)
          name=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).name)' "$manifest")
          version=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$manifest")
          if [ "$name" != "$EXPECTED_NAME" ] || [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::agent-bench archive identity mismatch: $name@$version."
            exit 1
          fi
          if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$version already on registry; skipping publish"
          else
            npm publish "$package" --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org
          fi
