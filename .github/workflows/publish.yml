name: Publish

on:
  push:
    tags:
      - 'v*'
      - 'agent-bench-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to retry
        required: true
        type: string

permissions:
  contents: read

# Explicit releases wait rather than replacing one another (up to GitHub's
# 100 pending-run limit). Source merges never enter this publication group.
concurrency:
  group: publish-agent-runtime
  cancel-in-progress: false
  queue: max

jobs:
  release-source:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false

      # Old-tag retries use this workflow's immutable policy, not candidate code.
      - name: Read workflow-pinned release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-policy
          sparse-checkout: scripts/verify-release-line.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify release source and version
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          EXPECTED_RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]] ||
             ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Expected an existing v* release tag, got '$RELEASE_TAG'."
            exit 1
          fi
          git fetch --force --no-tags --depth=1 origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_SHA=$(git rev-parse "$RELEASE_TAG^{}")
          CHECKOUT_SHA=$(git rev-parse HEAD)
          if [ "$CHECKOUT_SHA" != "$TAG_SHA" ]; then
            echo "::error::Checkout $CHECKOUT_SHA does not match $RELEASE_TAG at $TAG_SHA."
            exit 1
          fi
          if [ -n "$EXPECTED_RELEASE_SHA" ] && [ "$CHECKOUT_SHA" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::Release tag moved after the triggering event."
            exit 1
          fi
          NPM_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag/version mismatch: tag=$TAG_VERSION package=$NPM_VERSION."
            exit 1
          fi
          echo "sha=$CHECKOUT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release source locked: $RELEASE_TAG at $TAG_SHA"

      - name: Verify frozen release line admission
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION%%[-+]*}"
          LINE="release/${VERSION%.*}.x"
          node .release-policy/scripts/verify-release-line.mjs "$TAG_SHA" refs/remotes/origin/main "refs/remotes/origin/$LINE"

  verify:
    needs: release-source
    runs-on: [self-hosted, ci-public]
    outputs:
      release-version: ${{ needs.release-source.outputs.version }}
      package-sha256: ${{ steps.package.outputs.sha256 }}
      publication-pending: ${{ steps.npm.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          persist-credentials: false
      - name: Read exact first-party cohort
        id: cohort
        run: node scripts/release-cohort.mjs --github-output "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: pnpm install --frozen-lockfile && pnpm peers check
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Typecheck (src + examples; examples resolve against built dist)
        run: pnpm run typecheck
      - name: Verify package source and metadata
        run: pnpm run verify:package:static
      - name: Verify release API surface record
        run: pnpm run check:api-surface-record
      - name: Check out exact Interface release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-sdk
          ref: ${{ steps.cohort.outputs.agent_interface_ref }}
          path: .cohort/agent-sdk
          persist-credentials: false
      - name: Check out exact Eval release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-eval
          ref: ${{ steps.cohort.outputs.agent_eval_ref }}
          path: .cohort/agent-eval
          persist-credentials: false
      - name: Check out exact Knowledge release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-knowledge
          ref: ${{ steps.cohort.outputs.agent_knowledge_ref }}
          path: .cohort/agent-knowledge
          persist-credentials: false
      # The cohort builds each package with the pnpm its own repository pins, which corepack
      # downloads from npm. The 0.341.1 publish failed twice on that download (a 30 s timeout,
      # then HTTP 503). The pinned managers now come from a cache keyed on the pins, and a miss
      # warms them with bounded retries. Running each pin once is what caches pnpm 12's native
      # binary; `corepack prepare` alone leaves it to be downloaded at first use.
      - name: Read cohort package-manager pins
        id: package-managers
        run: |
          pins=$(for dir in . .cohort/agent-sdk .cohort/agent-eval .cohort/agent-knowledge; do
            node -p "require('./$dir/package.json').packageManager"
          done | sort -u | tr '\n' ' ')
          echo "pins=$pins" >> "$GITHUB_OUTPUT"
          echo "key=corepack-${RUNNER_OS}-$(echo "$pins" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore cohort package managers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corepack
          key: ${{ steps.package-managers.outputs.key }}
      - name: Warm cohort package managers
        env:
          COREPACK_HOME: ${{ runner.temp }}/corepack
          PINS: ${{ steps.package-managers.outputs.pins }}
        run: |
          for pin in $PINS; do
            dir="$RUNNER_TEMP/corepack-warm/$pin"
            mkdir -p "$dir"
            printf '{"packageManager":"%s"}\n' "$pin" > "$dir/package.json"
            for attempt in 1 2 3 4 5 6; do
              (cd "$dir" && corepack pnpm --version) && break
              if [ "$attempt" = 6 ]; then echo "::error::corepack could not fetch $pin"; exit 1; fi
              sleep $((attempt * 30))
            done
          done
      - name: Verify exact Interface, Eval, Knowledge, and Runtime archives together
        env:
          COREPACK_HOME: ${{ runner.temp }}/corepack
        run: >-
          node scripts/verify-packed-cohort.mjs
          --agent-interface-repo .cohort/agent-sdk
          --agent-eval-repo .cohort/agent-eval
          --agent-knowledge-repo .cohort/agent-knowledge
          --cohort-manifest release/cohort.json
          --report "$RUNNER_TEMP/cohort-report.json"
      - name: Package and verify the exact Runtime archive
        id: package
        run: |
          package_dir="$RUNNER_TEMP/agent-runtime-package"
          mkdir -p "$package_dir"
          npm_config_ignore_scripts=true pnpm pack --pack-destination "$package_dir"
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one Runtime archive, found ${#packages[@]}."
            exit 1
          fi
          package="${packages[0]}"
          node scripts/verify-package-exports.mjs "$package"
          node scripts/verify-edge-tool-loop.mjs "$package"
          sha256=$(sha256sum "$package" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Runtime archive locked: $package ($sha256)"
      - name: Emit and verify the conformance manifest for the exact archive
        run: |
          package_dir="$RUNNER_TEMP/agent-runtime-package"
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one Runtime archive, found ${#packages[@]}."
            exit 1
          fi
          cp "$RUNNER_TEMP/cohort-report.json" "$package_dir/cohort-report.json"
          manifest="$package_dir/agent-runtime-conformance-manifest.json"
          node scripts/emit-conformance-manifest.mjs \
            --tarball "${packages[0]}" \
            --cohort-report "$RUNNER_TEMP/cohort-report.json" \
            --out "$manifest"
          node scripts/verify-conformance-manifest.mjs "$manifest" \
            --tarball "${packages[0]}" \
            --cohort-report "$RUNNER_TEMP/cohort-report.json" \
            --source-root .
      - name: Upload exact Runtime archive and its conformance manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-runtime-package
          path: |
            ${{ runner.temp }}/agent-runtime-package/*.tgz
            ${{ runner.temp }}/agent-runtime-package/agent-runtime-conformance-manifest.json
            ${{ runner.temp }}/agent-runtime-package/cohort-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Admit only unpublished qualified npm archives
        id: npm
        run: node scripts/check-npm-publication.mjs "$RUNNER_TEMP/agent-runtime-package"

  verify-official-optimizers:
    needs: release-source
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: pnpm install --frozen-lockfile && pnpm peers check
      - name: Verify official optimizers
        run: pnpm run verify:official-optimizers

  verify-runtime-bench:
    needs: release-source
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: pnpm install --frozen-lockfile && pnpm peers check
      - name: Verify agent-bench against this release
        env:
          AGENT_BENCH_PACKAGE_TEST_TIMEOUT_MS: 900000
        run: pnpm run verify:bench

  publish-npm:
    needs: [verify, verify-official-optimizers, verify-runtime-bench]
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && needs.verify.outputs.publication-pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_NAME: '@tangle-network/agent-runtime'
      EXPECTED_VERSION: ${{ needs.verify.outputs.release-version }}
      EXPECTED_SHA256: ${{ needs.verify.outputs.package-sha256 }}
      LINE_SCOPED_BACKPORTS: 'true'
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-runtime-package
          path: ${{ runner.temp }}/agent-runtime-package
      - &npm-auth
        name: Configure npm auth (OIDC by default, token only when set)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          sed -i '/_authToken/d' "$HOME/.npmrc" 2>/dev/null || true
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set --location=user //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            echo 'NPM_TOKEN is set: publishing with the token fallback, still attested.'
          else
            echo 'No NPM_TOKEN: publishing through npm trusted publishing (OIDC).'
          fi
      # Shared YAML, not a new action or executable downloaded with authority.
      # Neither publisher checks out source, installs dependencies or builds.
      - name: Publish exact Runtime archive
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/agent-runtime-package
        run: &publish-exact |
          set -euo pipefail
          npm_version=$(npm --version)
          if [[ "$npm_version" != 11.* ]] ||
             [ "$(printf '%s\n%s\n' 11.5.1 "$npm_version" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::Expected npm >= 11.5.1 and < 12, received $npm_version."
            exit 1
          fi
          mapfile -t packages < <(find "$PACKAGE_DIRECTORY" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one archive, found ${#packages[@]}."
            exit 1
          fi
          package="${packages[0]}"
          actual_sha256=$(sha256sum "$package" | cut -d' ' -f1)
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo '::error::Archive digest mismatch.'
            exit 1
          fi
          manifest=$(tar -xOzf "$package" package/package.json)
          name=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).name)' "$manifest")
          version=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$manifest")
          if [ "$name" != "$EXPECTED_NAME" ] || [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::Archive identity mismatch: $name@$version."
            exit 1
          fi
          expected_integrity=$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto");process.stdout.write("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$package")
          if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$version exists; verifying its archive, not republishing"
          else
            # Retain the existing Runtime backport dist-tag policy.
            tag_args=()
            if [ "$LINE_SCOPED_BACKPORTS" = true ]; then
              latest=$(npm view "$name" version --registry=https://registry.npmjs.org 2>/dev/null || true)
              if [ -n "$latest" ] &&
                 [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
                tag_args=(--tag "release-${version%.*}")
              fi
            fi
            npm publish "$package" --ignore-scripts --provenance --access public "${tag_args[@]}" --registry=https://registry.npmjs.org
          fi
          # A version string alone is not evidence that the qualified bytes were served.
          # Check npm's archive integrity for both new publication and existing-version retries.
          # npm can take more than 10 minutes to serve a newly published version.
          for _ in $(seq 1 60); do
            if integrity_json=$(npm view "$name@$version" dist.integrity --json --registry=https://registry.npmjs.org 2>/dev/null); then
              REGISTRY_INTEGRITY_JSON="$integrity_json" EXPECTED_INTEGRITY="$expected_integrity" node <<'NODE'
          const raw = JSON.parse(process.env.REGISTRY_INTEGRITY_JSON)
          if (typeof raw !== 'string' || !raw.split(/\s+/).includes(process.env.EXPECTED_INTEGRITY)) {
            console.error('::error::Registry archive differs from the qualified archive or has no SHA-512 integrity.')
            process.exit(1)
          }
          NODE
              echo "$name@$version is served by the registry with matching archive integrity"
              exit 0
            fi
            sleep 30
          done
          echo "::error::$name@$version is not served by the registry after 30 minutes; inspect staging and publication before retrying."
          exit 1

  verify-agent-bench:
    # Manual dispatch remains root-only; bench retries use their tag run.
    if: startsWith(github.ref, 'refs/tags/agent-bench-v')
    runs-on: [self-hosted, ci-public]
    outputs:
      release-version: ${{ steps.release.outputs.version }}
      package-sha256: ${{ steps.package.outputs.sha256 }}
      publication-pending: ${{ steps.npm.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile && pnpm peers check
      - name: Wait for published agent-bench dependencies
        timeout-minutes: 25
        run: pnpm --filter @tangle-network/agent-bench run wait:published-dependencies
      - name: Verify agent-bench source and package metadata
        env:
          AGENT_BENCH_PACKAGE_TEST_TIMEOUT_MS: 900000
        run: pnpm run verify:bench:source
      - name: Verify tag/version lock
        id: release
        run: |
          NPM_VERSION=$(node -p "require('./bench/package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/agent-bench-v}"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag/version mismatch: tag=$TAG_VERSION package=$NPM_VERSION."
            exit 1
          fi
          echo "version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version locked: $NPM_VERSION"
      - name: Package and verify the exact agent-bench archive
        id: package
        run: |
          package_dir="$RUNNER_TEMP/agent-bench-package"
          mkdir -p "$package_dir"
          npm_config_ignore_scripts=true pnpm --dir bench pack --pack-destination "$package_dir"
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one agent-bench archive, found ${#packages[@]}."
            exit 1
          fi
          package="${packages[0]}"
          node bench/scripts/verify-packed-consumer.mjs --tarball "$package"
          sha256=$(sha256sum "$package" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "agent-bench archive locked: $package ($sha256)"
      - name: Upload exact agent-bench archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-bench-package
          path: ${{ runner.temp }}/agent-bench-package/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Admit only unpublished qualified npm archives
        id: npm
        run: node scripts/check-npm-publication.mjs "$RUNNER_TEMP/agent-bench-package"

  publish-agent-bench:
    needs: verify-agent-bench
    if: startsWith(github.ref, 'refs/tags/agent-bench-v') && needs.verify-agent-bench.outputs.publication-pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_NAME: '@tangle-network/agent-bench'
      EXPECTED_VERSION: ${{ needs.verify-agent-bench.outputs.release-version }}
      EXPECTED_SHA256: ${{ needs.verify-agent-bench.outputs.package-sha256 }}
      LINE_SCOPED_BACKPORTS: 'false'
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-bench-package
          path: ${{ runner.temp }}/agent-bench-package
      - *npm-auth
      - name: Publish exact agent-bench archive
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/agent-bench-package
        run: *publish-exact
