name: Publish

on:
  push:
    tags:
      - 'v*'
      - 'agent-bench-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to retry
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      release-sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Verify release source and version
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]] ||
             ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Expected an existing v* release tag, got '$RELEASE_TAG'."
            exit 1
          fi
          git fetch --force --no-tags --depth=1 origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_SHA=$(git rev-parse "$RELEASE_TAG^{}")
          CHECKOUT_SHA=$(git rev-parse HEAD)
          if [ "$CHECKOUT_SHA" != "$TAG_SHA" ]; then
            echo "::error::Checkout $CHECKOUT_SHA does not match $RELEASE_TAG at $TAG_SHA."
            exit 1
          fi
          NPM_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag/version mismatch: tag=$TAG_VERSION package=$NPM_VERSION."
            exit 1
          fi
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "Release source locked: $RELEASE_TAG at $TAG_SHA"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'

      # A release tag must sit on the tip of the line it releases. Without this, a
      # tag cut from an older commit publishes while newer merged commits are
      # silently excluded: 0.106.0 was tagged at the #624 merge and published 45
      # minutes before #626 merged, so the parallel-tool-call fix never reached the
      # registry even though it was already on main. Nothing failed — `latest`
      # simply did not contain the code main had.
      #
      # A tag is valid at the tip of `main` (normal release) or at the tip of a
      # `release/<major>.<minor>.x` branch (backport onto a line the fleet still
      # resolves — 0.x caret ranges only admit patches, so this is the only way to
      # ship a fix to a consumer pinned to an older minor). Comparing SHAs needs no
      # shared history, so a shallow fetch is sufficient.
      - name: Verify tag is the tip of its release line
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          git fetch --no-tags --depth=100 origin +refs/heads/main:refs/remotes/origin/main
          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          if [ "$TAG_SHA" = "$MAIN_SHA" ]; then
            echo "Tag is the tip of main: $TAG_SHA"
            exit 0
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          LINE="release/${VERSION%.*}.x"
          if git fetch --no-tags --depth=100 origin "+refs/heads/$LINE:refs/remotes/origin/$LINE" 2>/dev/null; then
            LINE_SHA=$(git rev-parse "refs/remotes/origin/$LINE")
            if [ "$TAG_SHA" = "$LINE_SHA" ]; then
              echo "Tag is the tip of $LINE: $TAG_SHA"
              exit 0
            fi
            echo "::error::Tag v$VERSION is at $TAG_SHA but $LINE is at $LINE_SHA."
            echo "Commits on $LINE this tag would NOT publish:"
            git log --oneline "$TAG_SHA".."$LINE_SHA" || true
            exit 1
          fi
          echo "::error::Tag v$VERSION is at $TAG_SHA, which is neither the tip of main ($MAIN_SHA) nor of $LINE (no such branch)."
          echo "Commits on main this tag would NOT publish:"
          git log --oneline "$TAG_SHA".."$MAIN_SHA" || true
          echo "Re-cut the tag at the tip of main, or push a $LINE branch for a backport."
          exit 1

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Typecheck (src + examples; examples resolve against built dist)
        run: pnpm run typecheck

      - name: Verify packed package exports
        run: pnpm run verify:package

      - name: Check out exact Interface release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-sdk
          ref: 149259a78bfa187e0b10ce840a03d25dd722e064 # @tangle-network/agent-interface@0.36.0
          path: .cohort/agent-sdk
          persist-credentials: false

      - name: Check out exact Eval release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-eval
          ref: 27899708faa4d679f7a04eab0b3c4d8cb4c7907c # v0.133.3
          path: .cohort/agent-eval
          persist-credentials: false

      - name: Check out exact Knowledge release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-knowledge
          ref: 4aeec20e164318fdb520830559ba0adf01d57127 # v6.1.5
          path: .cohort/agent-knowledge
          persist-credentials: false

      - name: Verify exact Interface, Eval, Knowledge, and Runtime archives together
        run: >-
          node scripts/verify-packed-cohort.mjs
          --agent-interface-repo .cohort/agent-sdk
          --agent-eval-repo .cohort/agent-eval
          --agent-knowledge-repo .cohort/agent-knowledge

      - name: Verify packed Runtime with official GEPA and SkillOpt
        run: pnpm run verify:official-optimizers

      - name: Verify PrimeIntellect package integration
        run: pnpm run verify:primeintellect

      - name: Verify agent-bench against this release
        run: pnpm run verify:bench

  publish-npm:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release-sha }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Tokenless OIDC trusted publishing requires npm >= 11.5.1. pnpm creates
      # the release tarball because it resolves catalog dependencies; npm then
      # publishes that exact, consumer-tested file. No setup-node registry-url:
      # it writes an empty-authToken .npmrc that blocks OIDC. Idempotent.
      # Requires the npmjs Trusted Publisher: org tangle-network, repo
      # agent-runtime, workflow publish.yml.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          # npm 12.0.0 ships a broken provenance publish (libnpmpublish requires
          # sigstore without bundling it); OIDC needs npm >= 11.5.1, so pin major 11.
          npm install -g npm@11
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on registry; skipping publish"
          else
            mkdir -p "$RUNNER_TEMP/agent-runtime-package"
            npm_config_ignore_scripts=true pnpm pack --pack-destination "$RUNNER_TEMP/agent-runtime-package"
            package="$(find "$RUNNER_TEMP/agent-runtime-package" -maxdepth 1 -name '*.tgz' -print -quit)"
            test -n "$package"
            node scripts/verify-package-exports.mjs "$package"
            # npm refuses to implicitly move `latest` to a LOWER version, which is
            # exactly what a backport off release/<major>.<minor>.x is. When this
            # version is not the highest published, publish it under a line-scoped
            # dist-tag instead. Dist-tags do not affect semver range resolution, so
            # a consumer pinned to ^0.84.0 still resolves 0.84.1.
            LATEST=$(npm view "$NAME" version 2>/dev/null || true)
            if [ -n "$LATEST" ] && \
               [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
              LINE_TAG="release-${VERSION%.*}"
              echo "$VERSION is below latest ($LATEST); publishing under dist-tag $LINE_TAG"
              npm publish "$package" --provenance --access public --tag "$LINE_TAG"
            else
              npm publish "$package" --provenance --access public
            fi
          fi

  verify-agent-bench:
    # Manual dispatch remains root-only. Re-run a failed bench tag workflow so
    # tag/version locking stays intact and the root package is never co-published.
    if: startsWith(github.ref, 'refs/tags/agent-bench-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify packed agent-bench against published dependencies
        run: pnpm run verify:bench:published

      - name: Verify tag/version lock
        run: |
          NPM_VERSION=$(node -p "require('./bench/package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/agent-bench-v}"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag/version mismatch: tag=$TAG_VERSION package=$NPM_VERSION."
            exit 1
          fi
          echo "Version locked: $NPM_VERSION"

  publish-agent-bench:
    needs: verify-agent-bench
    if: startsWith(github.ref, 'refs/tags/agent-bench-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Publish to npm (OIDC trusted publishing)
        run: |
          # Requires the npmjs Trusted Publisher on @tangle-network/agent-bench:
          # org tangle-network, repo agent-runtime, workflow publish.yml.
          npm install -g npm@11
          NAME=$(node -p "require('./bench/package.json').name")
          VERSION=$(node -p "require('./bench/package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on registry; skipping publish"
          else
            mkdir -p "$RUNNER_TEMP/agent-bench-package"
            pnpm --dir bench build
            npm_config_ignore_scripts=true pnpm --dir bench pack --pack-destination "$RUNNER_TEMP/agent-bench-package"
            package="$(find "$RUNNER_TEMP/agent-bench-package" -maxdepth 1 -name '*.tgz' -print -quit)"
            test -n "$package"
            npm publish "$package" --provenance --access public
          fi
