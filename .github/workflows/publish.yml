name: Publish

on:
  push:
    tags:
      - 'v*'
      - 'agent-bench-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to retry
        required: true
        type: string

permissions:
  contents: read

# Explicit releases wait rather than replacing one another (up to GitHub's
# 100 pending-run limit). Source merges never enter this publication group.
concurrency:
  group: publish-agent-runtime
  cancel-in-progress: false
  queue: max

jobs:
  qualify:
    uses: tangle-network/agent-runtime/.github/workflows/qualify-release.yml@3436fae29cf7760528764da77e3e969c1d6c34ae
    permissions:
      contents: read
    with:
      release_tag: ${{ inputs.release_tag }}

  publish-npm:
    needs: qualify
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && needs.qualify.outputs.runtime-publication-pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_NAME: '@tangle-network/agent-runtime'
      EXPECTED_VERSION: ${{ needs.qualify.outputs.runtime-release-version }}
      EXPECTED_SHA256: ${{ needs.qualify.outputs.runtime-package-sha256 }}
      LINE_SCOPED_BACKPORTS: 'true'
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - &node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-runtime-package
          path: ${{ runner.temp }}/agent-runtime-package
      - &npm-auth
        name: Configure npm auth (OIDC by default, token only when set)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          sed -i '/_authToken/d' "$HOME/.npmrc" 2>/dev/null || true
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set --location=user //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            echo 'NPM_TOKEN is set: publishing with the token fallback, still attested.'
          else
            echo 'No NPM_TOKEN: publishing through npm trusted publishing (OIDC).'
          fi
      # Shared YAML, not a new action or executable downloaded with authority.
      # Neither publisher checks out source, installs dependencies or builds.
      - name: Publish exact Runtime archive
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/agent-runtime-package
        run: &publish-exact |
          set -euo pipefail
          npm_version=$(npm --version)
          if [[ "$npm_version" != 11.* ]] ||
             [ "$(printf '%s\n%s\n' 11.5.1 "$npm_version" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::Expected npm >= 11.5.1 and < 12, received $npm_version."
            exit 1
          fi
          mapfile -t packages < <(find "$PACKAGE_DIRECTORY" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one archive, found ${#packages[@]}."
            exit 1
          fi
          package="${packages[0]}"
          actual_sha256=$(sha256sum "$package" | cut -d' ' -f1)
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo '::error::Archive digest mismatch.'
            exit 1
          fi
          manifest=$(tar -xOzf "$package" package/package.json)
          name=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).name)' "$manifest")
          version=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$manifest")
          if [ "$name" != "$EXPECTED_NAME" ] || [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::Archive identity mismatch: $name@$version."
            exit 1
          fi
          if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$version exists; verifying its archive, not republishing"
          else
            # Retain the existing Runtime backport dist-tag policy.
            tag_args=()
            if [ "$LINE_SCOPED_BACKPORTS" = true ]; then
              latest=$(npm view "$name" version --registry=https://registry.npmjs.org 2>/dev/null || true)
              if [ -n "$latest" ] &&
                 [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
                tag_args=(--tag "release-${version%.*}")
              fi
            fi
            npm publish "$package" --ignore-scripts --provenance --access public "${tag_args[@]}" --registry=https://registry.npmjs.org
          fi
          echo "$name@$version registered with npm; read-only verification checks advertised bytes."

  publish-agent-bench:
    needs: qualify
    if: startsWith(github.ref, 'refs/tags/agent-bench-v') && needs.qualify.outputs.bench-publication-pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_NAME: '@tangle-network/agent-bench'
      EXPECTED_VERSION: ${{ needs.qualify.outputs.bench-release-version }}
      EXPECTED_SHA256: ${{ needs.qualify.outputs.bench-package-sha256 }}
      LINE_SCOPED_BACKPORTS: 'false'
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - *node
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-bench-package
          path: ${{ runner.temp }}/agent-bench-package
      - *npm-auth
      - name: Publish exact agent-bench archive
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/agent-bench-package
        run: *publish-exact
  # A frozen tag can skip publishing from metadata alone; qualified bytes still need verification.
  verify-publication:
    needs: [qualify, publish-npm, publish-agent-bench]
    if: "!cancelled() && needs.qualify.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')"
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      PACKAGE: ${{ startsWith(github.ref, 'refs/tags/agent-bench-v') && 'agent-bench' || 'agent-runtime' }}
      EXPECTED_SHA256: ${{ startsWith(github.ref, 'refs/tags/agent-bench-v') && needs.qualify.outputs.bench-package-sha256 || needs.qualify.outputs.runtime-package-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.workflow_sha }}', sparse-checkout: scripts, persist-credentials: false }
      - *node
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PACKAGE }}-package
          path: ${{ runner.temp }}/publication-package
      - name: Verify advertised bytes against the qualified archive
        run: |
          for _ in $(seq 1 60); do
            status=0
            node scripts/check-npm-publication.mjs "$RUNNER_TEMP/publication-package" --require-published || status=$?
            [ "$status" -ne 0 ] || exit 0
            [ "$status" -eq 3 ] || exit "$status"
            sleep 30
          done
          echo '::error::Qualified archive is not served by the registry after the propagation wait.'
          exit 1
