name: Deduplicate profile improvement experiment support

on:
  push:
    branches:
      - feat/authored-profile-candidate

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/authored-profile-candidate
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair extraction parser for inline return types
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/scripts/refactor-profile-improvement-support.py')
          text = path.read_text()
          old = '''    start = text.index(signature)
              brace = text.index("{", start)
              depth = 0
              quote: str | None = None
              escaped = False
              line_comment = False
              block_comment = False
              index = brace
          '''
          old = '\n'.join(line[14:] if line.startswith('              ') else line for line in old.splitlines()) + '\n'
          new = '''    start = text.index(signature)
              parameter_open = text.index("(", start)
              parameter_depth = 0
              parameter_end = None
              for cursor in range(parameter_open, len(text)):
                  char = text[cursor]
                  if char == "(":
                      parameter_depth += 1
                  elif char == ")":
                      parameter_depth -= 1
                      if parameter_depth == 0:
                          parameter_end = cursor + 1
                          break
              if parameter_end is None:
                  raise SystemExit(f"{signature}: unbalanced parameters")
              brace = text.index("{", parameter_end)
              prefix = text[parameter_end:brace].rstrip()
              if prefix.endswith(":"):
                  type_depth = 0
                  type_end = None
                  for cursor in range(brace, len(text)):
                      char = text[cursor]
                      if char == "{":
                          type_depth += 1
                      elif char == "}":
                          type_depth -= 1
                          if type_depth == 0:
                              type_end = cursor + 1
                              break
                  if type_end is None:
                      raise SystemExit(f"{signature}: unbalanced inline return type")
                  brace = text.index("{", type_end)
              depth = 0
              quote: str | None = None
              escaped = False
              line_comment = False
              block_comment = False
              index = brace
          '''
          new = '\n'.join(line[14:] if line.startswith('              ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'extraction parser anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

      - name: Extract canonical profile experiment support
        run: python .github/scripts/refactor-profile-improvement-support.py

      - name: Format changed source
        run: pnpm exec biome check --write src/intelligence/profile-improvement-experiment.ts src/intelligence/improvement-cycle.ts src/intelligence/authored-profile-improvement.ts

      - name: Validate source, fixtures, behavior, and docs
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run check:testing-fixture
          pnpm test
          pnpm run docs:api
          pnpm run docs:freshness

      - name: Commit validated refactor
        shell: bash
        run: |
          rm .github/workflows/refactor-profile-improvement-support.yml
          rm .github/scripts/refactor-profile-improvement-support.py
          git add \
            src/intelligence/profile-improvement-experiment.ts \
            src/intelligence/improvement-cycle.ts \
            src/intelligence/authored-profile-improvement.ts \
            docs/api \
            .github/workflows/refactor-profile-improvement-support.yml \
            .github/scripts/refactor-profile-improvement-support.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "No refactor changes to commit"; exit 1; }
          git commit -m "refactor: share canonical profile experiment support"
          git push origin HEAD:feat/authored-profile-candidate
