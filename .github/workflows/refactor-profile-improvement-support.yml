name: Deduplicate profile improvement experiment support

on:
  push:
    branches:
      - feat/authored-profile-candidate

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/authored-profile-candidate
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Keep the generic optimization receipt import
        run: sed -i '/"attachOptimizationActivationReceipt",/d' .github/scripts/refactor-profile-improvement-support.py

      - name: Extract canonical profile experiment support
        run: python .github/scripts/refactor-profile-improvement-support.py

      - name: Format changed source
        run: pnpm exec biome check --write src/intelligence/profile-improvement-experiment.ts src/intelligence/improvement-cycle.ts src/intelligence/authored-profile-improvement.ts

      - name: Validate source, fixtures, behavior, and docs
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run check:testing-fixture
          pnpm test
          pnpm run docs:api
          pnpm run docs:freshness

      - name: Commit validated refactor
        shell: bash
        run: |
          rm .github/workflows/refactor-profile-improvement-support.yml
          rm .github/scripts/refactor-profile-improvement-support.py
          git add \
            src/intelligence/profile-improvement-experiment.ts \
            src/intelligence/improvement-cycle.ts \
            src/intelligence/authored-profile-improvement.ts \
            docs/api \
            .github/workflows/refactor-profile-improvement-support.yml \
            .github/scripts/refactor-profile-improvement-support.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "No refactor changes to commit"; exit 1; }
          git commit -m "refactor: share canonical profile experiment support"
          git push origin HEAD:feat/authored-profile-candidate
