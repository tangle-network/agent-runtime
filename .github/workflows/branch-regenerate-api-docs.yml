name: Branch API docs regeneration

on:
  push:
    branches:
      - feat/meta-harness-developer-surface

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/meta-harness-developer-surface
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API documentation
        run: pnpm run docs:api

      - name: Commit generated documentation
        shell: bash
        run: |
          git add docs/api
          if git diff --cached --quiet; then
            echo "API documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate API reference"
          git push origin HEAD:feat/meta-harness-developer-surface
