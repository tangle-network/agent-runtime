name: Prepare exact OTEL repair
on:
  push:
    branches: ['fix/otel-idle-flush-acknowledgement']
    paths: ['.github/workflows/prepare-otel-delivery.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'tangle-network/agent-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply the verified patch and retain blobs without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          files = {'src/otel-export.ts': 'd9f0078b35709b6caa0d8d62028b04ff3441f5d1', 'tests/otel-export.test.ts': '4db2bb895f6856509d381a9ea4ecc66d200ce987'}
          for path, expected in files.items():
              assert blob(pathlib.Path(path).read_bytes()) == expected, path + ' preimage changed'
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '6d9f55e7f51dd310ca24b878f7e72708b7c9628fd856658ba4c07924c802a4a9'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          assert blob(pathlib.Path('src/otel-export.ts').read_bytes()) == '0e922392f1f88a0c312471095c43fbfb5d3f3f19'
          for path in files:
              data = pathlib.Path(path).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/tangle-network/agent-runtime/git/blobs',
                  data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == blob(data)
              print(json.dumps({'path': path, 'blob': result['sha'], 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}))
          PY
