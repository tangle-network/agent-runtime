name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release-note and release-prep checks diff against the merge base.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: pnpm install --frozen-lockfile && pnpm peers check

      - name: Check publish credential isolation
        run: pnpm run check:publish-workflow

      - name: Check upstream evidence workflow
        run: pnpm run check:upstream-evidence-workflow

      - name: Check feature release note or release bump
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          if git diff --name-only "$base"...HEAD | grep -qx 'CHANGELOG.md'; then
            pnpm run check:version-bump
          else
            pnpm run check:release-notes
          fi

      - name: Lint (biome)
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Typecheck (src + examples; examples resolve against built dist)
        run: pnpm run typecheck

      - name: Verify packed package exports
        run: pnpm run verify:package

      - name: Docs (regenerate API reference + freshness gate)
        run: pnpm run docs:check

  packed-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact first-party cohort
        id: cohort
        run: node scripts/release-cohort.mjs --github-output "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-sdk
          ref: ${{ steps.cohort.outputs.agent_interface_ref }}
          path: .cohort/agent-sdk
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-eval
          ref: ${{ steps.cohort.outputs.agent_eval_ref }}
          path: .cohort/agent-eval
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangle-network/agent-knowledge
          ref: ${{ steps.cohort.outputs.agent_knowledge_ref }}
          path: .cohort/agent-knowledge
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify exact Interface, Eval, Knowledge, and Runtime archives together
        run: >-
          node scripts/verify-packed-cohort.mjs
          --agent-interface-repo .cohort/agent-sdk
          --agent-eval-repo .cohort/agent-eval
          --agent-knowledge-repo .cohort/agent-knowledge
          --cohort-manifest release/cohort.json

  agent-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install package set
        run: pnpm install --frozen-lockfile && pnpm peers check

      - name: Verify agent-bench against current agent-runtime
        env:
          AGENT_BENCH_PACKAGE_TEST_TIMEOUT_MS: 900000
        run: pnpm run verify:bench

  official-optimizers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package set
        run: pnpm install --frozen-lockfile && pnpm peers check

      - name: Verify packed Runtime with official GEPA and SkillOpt
        run: pnpm run verify:official-optimizers
