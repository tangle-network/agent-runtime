name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Typecheck (src + examples; examples resolve against built dist)
        run: pnpm run typecheck

      - name: Verify packed package exports
        run: pnpm run verify:package

      - name: Docs (regenerate API reference + freshness gate)
        run: pnpm run docs:check

  agent-bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bench/pnpm-lock.yaml

      - name: Install published dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck public entrypoint against installed packages
        run: pnpm run typecheck:public

      - name: Test deterministic package paths
        run: pnpm test

      - name: Verify packed package in a clean consumer
        run: pnpm run verify:package
