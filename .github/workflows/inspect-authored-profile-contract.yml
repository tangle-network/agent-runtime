name: Inspect authored profile contract

on:
  push:
    branches:
      - feat/authored-profile-candidate

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print authored profile fixtures
        shell: bash
        run: |
          set -euo pipefail
          test_file=tests/improvement-cycle.test.ts
          line=$(grep -n -m1 "measures and activates a directly authored complete profile without improve" "$test_file" | cut -d: -f1)
          start=$((line > 100 ? line - 100 : 1))
          end=$((line + 360))
          echo "--- authored profile test ($start-$end) ---"
          nl -ba "$test_file" | sed -n "${start},${end}p"
          echo "--- helper declarations used by the test ---"
          for pattern in "const baselineProfile" "const profileBenchmark" "function profile" "const profileSource" "stateDigest" "profileExecutionRef"; do
            grep -n -m5 -C 8 "$pattern" "$test_file" || true
          done
          echo "--- profile schema lineage refinements ---"
          nl -ba node_modules/@tangle-network/agent-interface/dist/agent-profile-improvement-schema.js | sed -n '160,245p'
          echo "--- candidate lineage refinements ---"
          nl -ba node_modules/@tangle-network/agent-interface/dist/agent-candidate-lineage-schema.js | sed -n '33,90p'
