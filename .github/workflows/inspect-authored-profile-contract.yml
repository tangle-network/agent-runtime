name: Inspect authored profile contract

on:
  push:
    branches:
      - feat/authored-profile-candidate

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print current profile improvement seams
        shell: bash
        run: |
          set -euo pipefail
          file=src/intelligence/improvement-cycle.ts
          grep -n "ProposeAgentProfileImprovementOptions\|proposeAgentProfileImprovement\|sealProfileImprovementBenchmark\|profileImprovementMetadata\|assertProfileReleaseWorkIsFresh\|createProfileImprovementCostLedger\|profilePolicyWithBudget\|profilePreparationAccounting" "$file"
          for pattern in \
            "export interface ProposeAgentProfileImprovementOptions" \
            "export interface ProposeAgentProfileImprovementResult" \
            "function createProfileImprovementCostLedger" \
            "function sealProfileImprovementBenchmark" \
            "function assertProfileReleaseWorkIsFresh" \
            "function profileImprovementMetadata" \
            "export async function proposeAgentProfileImprovement"; do
            line=$(grep -n -m1 "$pattern" "$file" | cut -d: -f1)
            start=$((line > 25 ? line - 25 : 1))
            end=$((line + 180))
            echo "--- $pattern ($start-$end) ---"
            nl -ba "$file" | sed -n "${start},${end}p"
          done
          echo "--- current intelligence exports ---"
          grep -n -C 4 "ProposeAgentProfileImprovement\|proposeAgentProfileImprovement" src/intelligence/index.ts
          echo "--- exact candidate lineage ---"
          grep -R -n -C 10 "interface AgentCandidateLineage\|type AgentCandidateLineage\|agentCandidateLineageSchema" node_modules/@tangle-network/agent-interface/dist | head -n 500 || true
