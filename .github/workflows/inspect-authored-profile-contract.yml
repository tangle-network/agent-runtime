name: Finalize authored profile candidate

on:
  push:
    branches:
      - feat/authored-profile-candidate

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/authored-profile-candidate
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export and normalize the new surface
        shell: python
        run: |
          from pathlib import Path
          import json

          source_path = Path('src/intelligence/authored-profile-improvement.ts')
          source = source_path.read_text().replace('  type Scenario,\n', '')
          source_path.write_text(source)

          test_path = Path('tests/authored-profile-improvement.test.ts')
          test = test_path.read_text().replace(
              'expect(result.proposal.evaluation.generationsExplored).toBe(0)',
              'expect(result.proposal.evaluation.generationsExplored).toBeUndefined()',
          )
          test_path.write_text(test)

          index_path = Path('src/intelligence/index.ts')
          text = index_path.read_text()
          anchor = "export type {\n  AgentCandidateExperimentCellPlacement,"
          exports = """export type {
            AgentProfileCandidateMeasurementExecutor,
            AuthoredAgentProfileCandidateLineage,
            AuthoredAgentProfileDiffOptions,
            ProposeAuthoredAgentProfileImprovementOptions,
            ProposeAuthoredAgentProfileImprovementResult,
          } from './authored-profile-improvement'
          export { proposeAuthoredAgentProfileImprovement } from './authored-profile-improvement'
          """
          if "from './authored-profile-improvement'" not in text:
              if anchor not in text:
                  raise SystemExit('intelligence export anchor not found')
              text = text.replace(anchor, exports + anchor, 1)
              index_path.write_text(text)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '0.137.1'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          Path('.github/workflows/inspect-authored-profile-contract.yml').unlink()

      - name: Format source and tests
        run: pnpm exec biome check --write src/intelligence/authored-profile-improvement.ts src/intelligence/index.ts tests/authored-profile-improvement.test.ts

      - name: Validate the focused implementation
        run: |
          pnpm exec vitest run tests/authored-profile-improvement.test.ts
          pnpm run typecheck

      - name: Regenerate API documentation
        run: pnpm run docs:api

      - name: Commit the validated branch
        shell: bash
        run: |
          git add package.json src/intelligence docs/api tests/authored-profile-improvement.test.ts .github/workflows/inspect-authored-profile-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: measure authored profiles without optimizer lineage"
          git push origin HEAD:feat/authored-profile-candidate
