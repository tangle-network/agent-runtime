name: Prepare OIDC caller dependency
on:
  push:
    branches: [gtr/oidc-client-package-20260926]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 68532c2c76e6dea3c3d66c5977a9c269fef5b3f5
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Build and pack pinned source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 68532c2c76e6dea3c3d66c5977a9c269fef5b3f5
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          mkdir -p "$RUNNER_TEMP/oidc-tarball" "$RUNNER_TEMP/oidc-package"
          pnpm pack --pack-destination "$RUNNER_TEMP/oidc-tarball"
          tar -xzf "$RUNNER_TEMP"/oidc-tarball/*.tgz -C "$RUNNER_TEMP/oidc-package" --strip-components=1
          sha256sum "$RUNNER_TEMP"/oidc-tarball/*.tgz
      - name: Publish built Git dependency without changing main or npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/oidc-package"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.scripts;
          delete pkg.devDependencies;
          delete pkg.packageManager;
          pkg.tangleBuild = { sourceRepository: 'tangle-network/agent-runtime', sourceCommit: '68532c2c76e6dea3c3d66c5977a9c269fef5b3f5', workflowRun: process.env.GITHUB_RUN_ID };
          if (JSON.stringify(pkg).includes('catalog:') || JSON.stringify(pkg).includes('workspace:')) throw new Error('Unresolved workspace dependency');
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const p = await import('./dist/platform.js');
          if (typeof p.PlatformOidcClient !== 'function' || typeof p.createPkcePair !== 'function') throw new Error('Missing OIDC exports');
          console.log(JSON.stringify({version:pkg.version,PlatformOidcClient:typeof p.PlatformOidcClient,createPkcePair:typeof p.createPkcePair}));
          NODE
          printf '%s\n' 'Built from tangle-network/agent-runtime at 68532c2c76e6dea3c3d66c5977a9c269fef5b3f5.' 'This is a prepared Git dependency, not a source branch to merge.' 'No source files or authorization-server routes were changed.' > BUILD_PROVENANCE.md
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'build: immutable runtime package from 68532c2c'
          git remote add origin https://github.com/tangle-network/agent-runtime.git
          gh auth setup-git
          if test -n "$(git ls-remote --heads origin refs/heads/build/oidc-68532c2c)"; then
            echo 'Ref already exists. Refusing to overwrite an immutable build.'
            exit 1
          fi
          git push origin HEAD:refs/heads/build/oidc-68532c2c
          git rev-parse HEAD
