name: Finalize pursuit observer API docs

on:
  push:
    branches:
      - codex/pursuit-observer-plane

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish a documented digest parameter shape
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const path = 'src/durable/observer-journal.ts'
          const source = await readFile(path, 'utf8')
          const before = 'export function observerRecordDigest(record: UnsignedObserverRecord): string {'
          const after = `/** Compute the canonical SHA-256 digest for an unsigned observer record. */
          export function observerRecordDigest(record: Omit<ObserverRecord, 'digest'>): string {`
          if (!source.includes(before)) throw new Error('expected digest signature was not found')
          await writeFile(path, source.replace(before, after))
          NODE
          pnpm biome check --write src/durable/observer-journal.ts

      - name: Regenerate and verify API reference
        run: pnpm run docs:api

      - name: Commit canonical source and generated reference
        run: |
          rm .github/workflows/repair-api-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/durable/observer-journal.ts docs/api .github/workflows/repair-api-docs.yml
          git commit -m "fix(durable): publish digest shape and regenerate API docs"
          git push origin HEAD:codex/pursuit-observer-plane
