name: Repair API docs

on:
  push:
    branches:
      - codex/pursuit-observer-plane

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate API reference and capture output
        run: |
          mkdir -p diagnostics
          set +e
          pnpm run docs:api > diagnostics/docs-api.log 2>&1
          status=$?
          set -e
          {
            echo
            echo "exit_status=$status"
          } >> diagnostics/docs-api.log
          cat diagnostics/docs-api.log

      - name: Upload generated reference and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-api-docs-diagnostic
          path: |
            diagnostics/docs-api.log
            docs/api
          if-no-files-found: error
