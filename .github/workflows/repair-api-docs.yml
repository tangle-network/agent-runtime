name: Repair API docs

on:
  push:
    branches:
      - codex/pursuit-observer-plane

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish a documented digest parameter shape
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const path = 'src/durable/observer-journal.ts'
          const source = await readFile(path, 'utf8')
          const before = 'export function observerRecordDigest(record: UnsignedObserverRecord): string {'
          const after = `/** Compute the canonical SHA-256 digest for an unsigned observer record. */
          export function observerRecordDigest(record: Omit<ObserverRecord, 'digest'>): string {`
          if (!source.includes(before)) throw new Error('expected digest signature was not found')
          await writeFile(path, source.replace(before, after))
          NODE
          pnpm biome check --write src/durable/observer-journal.ts

      - name: Regenerate API reference and capture output
        run: |
          mkdir -p diagnostics
          set +e
          pnpm run docs:api > diagnostics/docs-api.log 2>&1
          status=$?
          set -e
          {
            echo
            echo "exit_status=$status"
          } >> diagnostics/docs-api.log
          cat diagnostics/docs-api.log

      - name: Upload source repair, generated reference, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-api-docs-diagnostic
          path: |
            src/durable/observer-journal.ts
            diagnostics/docs-api.log
            docs/api
          if-no-files-found: error
