name: Training consolidation preparation
on:
  push:
    branches: [audit/training-consolidation-20260918]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: training-consolidation-preparation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact mainline worktree with the reviewed patch
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = 6a419eac84bbf3ec80760d61385cd316395ea93b
          base64 --decode .audit/training-consolidation.patch.gz.b64 | gzip --decompress > /tmp/training-consolidation.patch
          echo '795f0348898d47cc37ed46611b631ff7bc1ec75fdb02820234601b33d2f9a1c1  /tmp/training-consolidation.patch' | sha256sum --check
          git worktree add -b audit/training-product /tmp/training-product 6a419eac84bbf3ec80760d61385cd316395ea93b
          cd /tmp/training-product
          git apply --check /tmp/training-consolidation.patch
          git apply /tmp/training-consolidation.patch
          test ! -d .audit
          test ! -f .github/workflows/training-consolidation-audit.yml
          mkdir -p /tmp/training-evidence
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.32'
      - name: Install unchanged frozen dependency cohort
        working-directory: /tmp/training-product
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm peers check
      - name: Prepare Runtime and Bench release metadata
        working-directory: /tmp/training-product
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'bench/package.json';
          const raw = fs.readFileSync(path, 'utf8');
          if (JSON.parse(raw).version !== '0.13.4') throw new Error('unexpected Bench baseline');
          fs.writeFileSync(path, raw.replace('"version": "0.13.4"', '"version": "0.13.5"'));
          const log = fs.readFileSync('bench/CHANGELOG.md', 'utf8');
          if (!log.startsWith('# Changelog\n\n')) throw new Error('unexpected Bench changelog');
          fs.writeFileSync('bench/CHANGELOG.md', log.replace('# Changelog\n\n', '# Changelog\n\n## 0.13.5\n\nConsume Runtime 0.243.0 through the existing workspace dependency. Benchmark APIs and grading behavior are unchanged.\n\n'));
          NODE
          pnpm run release:prepare 0.243.0
          pnpm run api:surface
          git diff --check
          git config user.name 'Repository verification'
          git config user.email 'verification@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(improvement): consolidate training validation and execution lifecycle'
          git rev-parse HEAD > /tmp/training-evidence/candidate.sha
          git rev-parse HEAD^ > /tmp/training-evidence/base.sha
      - name: Verify native checks and full test suite
        working-directory: /tmp/training-product
        run: |
          set -euo pipefail
          pnpm run lint 2>&1 | tee /tmp/training-evidence/lint.log
          pnpm run test 2>&1 | tee /tmp/training-evidence/tests.log
          pnpm run typecheck 2>&1 | tee /tmp/training-evidence/types.log
      - name: Verify release gates, exact package, and generated docs
        working-directory: /tmp/training-product
        env:
          PACKAGE_VERSION_BUMP_BASE: '6a419eac84bbf3ec80760d61385cd316395ea93b'
        run: |
          set -euo pipefail
          pnpm run check:publish-workflow
          pnpm run check:upstream-evidence-workflow
          pnpm run check:version-bump 2>&1 | tee /tmp/training-evidence/version.log
          pnpm run verify:package 2>&1 | tee /tmp/training-evidence/package.log
          pnpm run docs:check 2>&1 | tee /tmp/training-evidence/docs.log
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Retain verified candidate and logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/training-evidence
          if [ -d /tmp/training-product ]; then
            cd /tmp/training-product
            git status --short > /tmp/training-evidence/status.txt
            git diff HEAD --binary > /tmp/training-evidence/uncommitted.patch
            git bundle create /tmp/training-evidence/candidate.bundle audit/training-product
            tar --exclude='./.git' --exclude='node_modules' --exclude='./.cohort' -czf /tmp/training-evidence/source.tar.gz .
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: training-consolidation-verification
          path: /tmp/training-evidence/
          retention-days: 5
  deliver:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: training-consolidation-verification
          path: /tmp/training-evidence
      - name: Deliver only verified Git objects, never package scripts
        run: |
          set -euo pipefail
          expected=$(cat /tmp/training-evidence/candidate.sha)
          test "$(cat /tmp/training-evidence/base.sha)" = 6a419eac84bbf3ec80760d61385cd316395ea93b
          test ! -s /tmp/training-evidence/status.txt
          git fetch /tmp/training-evidence/candidate.bundle audit/training-product
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          test "$(git rev-parse "$expected^")" = 6a419eac84bbf3ec80760d61385cd316395ea93b
          test -z "$(git ls-tree -r --name-only "$expected" -- .audit .github/workflows/training-consolidation-audit.yml)"
          git push origin "$expected:refs/heads/refactor/training-execution-consolidation"
