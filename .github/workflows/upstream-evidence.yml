name: Runtime upstream evidence

# Publish calls this between qualification and npm publication, so a failed contract
# publishes nothing. It runs only what qualification does not: the public contracts, each
# against the exact qualified archive. Source, suite, exports and cohort were qualified once.
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      package_sha256:
        type: string
        required: true

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.check }}
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [UP-02, UP-03, UP-04, UP-10, UP-11, UP-12, UP-13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activate repository package manager
        run: |
          manager_dir=$(mktemp -d "$RUNNER_TEMP/upstream-pnpm.XXXXXX")
          export COREPACK_HOME="$manager_dir/corepack" PNPM_CONFIG_STORE_DIR="$manager_dir/store"
          mkdir -p "$manager_dir/bin"
          corepack install --global "$(node -p "require('./package.json').packageManager")"
          corepack enable --install-directory "$manager_dir/bin" pnpm
          printf '%s\n' "COREPACK_HOME=$COREPACK_HOME" "PNPM_CONFIG_STORE_DIR=$PNPM_CONFIG_STORE_DIR" >> "$GITHUB_ENV"
          echo "$manager_dir/bin" >> "$GITHUB_PATH"
          "$manager_dir/bin/pnpm" --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-runtime-package
          path: ${{ runner.temp }}/agent-runtime-package

      - name: Run public contract on the qualified archive
        env:
          CHECK: ${{ matrix.check }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA256: ${{ inputs.package_sha256 }}
        run: |
          mapfile -t packages < <(find "$RUNNER_TEMP/agent-runtime-package" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one Runtime archive, found ${#packages[@]}."
            exit 1
          fi
          if [ "$(sha256sum "${packages[0]}" | cut -d' ' -f1)" != "$EXPECTED_SHA256" ]; then
            echo '::error::Archive digest mismatch: this is not the qualified archive.'
            exit 1
          fi
          node scripts/run-upstream-contract.mjs \
            --check "$CHECK" \
            --tarball "${packages[0]}" \
            --release-tag "$RELEASE_TAG" \
            --tag-commit "$(git rev-parse HEAD)" \
            --cohort-manifest release/cohort.json \
            --output "$RUNNER_TEMP/upstream-evidence/$CHECK.json"

      - name: Retain contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-runtime-${{ matrix.check }}
          path: ${{ runner.temp }}/upstream-evidence/${{ matrix.check }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
