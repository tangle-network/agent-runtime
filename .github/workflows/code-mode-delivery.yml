name: Apply exact code-mode implementation to PR 1626
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/code-mode-delivery.yml'
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.number == 1626 && github.event.pull_request.head.repo.full_name == 'tangle-network/agent-runtime' && github.event.pull_request.head.ref == 'feat/runtime-codemode-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Verify and apply exact already-authored patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '4776df39b78181ea324c357b87287f4a5fa576a6ec531d013902e853867c0907  scripts/codemode-delivery-1.patch' \
            'c49ff903947de9caebe92a6fb2c7dd792d67d84202940a48998c46f1c78aeb65  scripts/codemode-delivery-2.patch' \
            '05a79b9fb3c85dcda1384ace3cea0b11ccc3cdd22f9220068927eabc3805bb38  scripts/codemode-delivery-3.patch' | sha256sum -c -
          cat scripts/codemode-delivery-{1,2,3}.patch > "$RUNNER_TEMP/codemode.patch"
          git apply --check --index "$RUNNER_TEMP/codemode.patch"
          git apply --index "$RUNNER_TEMP/codemode.patch"
          python3 - <<'PY'
          import subprocess
          expected = {
              '.release-notes/runtime-codemode.md', 'examples/code-mode/index.ts',
              'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'scripts/code-mode-proof.mts',
              'skills/codemode/SKILL.md', 'skills/codemode/references/runtime-execution.md',
              'src/runtime/authored-code.ts', 'src/runtime/code-mode.ts', 'src/runtime/index.ts',
              'src/runtime/local-sandbox-client.ts', 'src/runtime/router-client.ts',
              'src/runtime/supervise/code-mode.ts', 'src/runtime/supervise/runtime.ts',
              'src/runtime/tool-loop.ts', 'tests/kernel/code-mode.test.ts',
              'tests/kernel/harness-native-tools.test.ts',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert actual == expected, (actual ^ expected)
          PY
          git rm scripts/codemode-delivery-{1,2,3}.patch .github/workflows/code-mode-delivery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(codemode): integrate isolated scripting into existing Runtime executors'
          git push origin HEAD:refs/heads/feat/runtime-codemode-20261006
