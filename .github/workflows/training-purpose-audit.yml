name: Training purpose audit preparation
on:
  push:
    branches: [audit/training-purpose-20260919]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: training-purpose-audit
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed patch to exact mainline
        run: |
          test "$(git rev-parse origin/main)" = '3505d81e7f85683bc25bbd46a6bcbfdaf9503a71'
          cat .audit/training-purpose.patch.0 .audit/training-purpose.patch.1 | base64 --decode | gzip --decompress > /tmp/training-purpose.patch
          echo '04ea6c92d81c33ec7e319fd03ff3f70eb4997aac4dabecd85ddb5e4a6919d5ea  /tmp/training-purpose.patch' | sha256sum --check
          git config --global user.name 'Repository verification'
          git config --global user.email 'verification@users.noreply.github.com'
          git worktree add -b audit/training-purpose-product /tmp/training-purpose-product 3505d81e7f85683bc25bbd46a6bcbfdaf9503a71
          cd /tmp/training-purpose-product
          git apply --check /tmp/training-purpose.patch
          git apply /tmp/training-purpose.patch
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.32'
      - name: Install unchanged dependency cohort
        working-directory: /tmp/training-purpose-product
        run: pnpm install --frozen-lockfile && pnpm peers check
      - name: Regenerate release metadata
        working-directory: /tmp/training-purpose-product
        run: |
          pnpm run release:prepare 0.244.0
          pnpm run api:surface
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github .audit)"
          git commit -m 'fix(improvement): enforce training provenance at held-out boundaries'
      - name: Verify native types, lint, and training integration regressions
        working-directory: /tmp/training-purpose-product
        run: |
          mkdir -p /tmp/training-purpose-evidence
          pnpm run lint 2>&1 | tee /tmp/training-purpose-evidence/lint.log
          pnpm run typecheck 2>&1 | tee /tmp/training-purpose-evidence/types.log
          pnpm exec vitest run tests/profile-training-exposure.test.ts tests/authored-profile-improvement.test.ts tests/improvement-cycle.test.ts tests/profile-training.test.ts tests/profile-training-boundaries.test.ts 2>&1 | tee /tmp/training-purpose-evidence/regressions.log
      - name: Verify package, release rules, and generated documentation
        working-directory: /tmp/training-purpose-product
        run: |
          pnpm run check:version-bump 2>&1 | tee /tmp/training-purpose-evidence/version.log
          pnpm run check:publish-workflow
          pnpm run check:upstream-evidence-workflow
          pnpm run verify:package 2>&1 | tee /tmp/training-purpose-evidence/package.log
          pnpm run docs:check 2>&1 | tee /tmp/training-purpose-evidence/docs.log
          test -z "$(git status --porcelain)"
      - name: Retain exact candidate and evidence
        if: always()
        run: |
          mkdir -p /tmp/training-purpose-evidence
          if [ -d /tmp/training-purpose-product ]; then
            cd /tmp/training-purpose-product
            git status --short > /tmp/training-purpose-evidence/status.txt
            git rev-parse HEAD > /tmp/training-purpose-evidence/candidate.sha
            git rev-parse origin/main > /tmp/training-purpose-evidence/base.sha
            git diff HEAD --binary > /tmp/training-purpose-evidence/working.patch
            git bundle create /tmp/training-purpose-evidence/candidate.bundle audit/training-purpose-product
            tar --exclude='./.git' --exclude='node_modules' --exclude='./.cohort' -czf /tmp/training-purpose-evidence/source.tar.gz .
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: training-purpose-verified
          path: /tmp/training-purpose-evidence/
          retention-days: 5
  deliver:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: training-purpose-verified
          path: /tmp/training-purpose-evidence
      - name: Deliver verified Git objects without executing package scripts
        run: |
          expected=$(cat /tmp/training-purpose-evidence/candidate.sha)
          test "$(cat /tmp/training-purpose-evidence/base.sha)" = '3505d81e7f85683bc25bbd46a6bcbfdaf9503a71'
          git fetch /tmp/training-purpose-evidence/candidate.bundle audit/training-purpose-product
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git merge-base --is-ancestor origin/main "$expected"
          test -z "$(git diff --name-only origin/main "$expected" -- .github .audit)"
          git push origin "$expected:refs/heads/fix/training-evaluation-provenance"
