name: Adopt stack

# Adopts each new @tangle-network release through agent-eval's reusable
# workflow, which owns the pinning, peer-range widening and PR rules.
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@d5d06325c49681ece3a6ee70a8dac12987b296d9
    with:
      stack-ref: d5d06325c49681ece3a6ee70a8dac12987b296d9
      gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test
      post-pin: node scripts/release-notes.mjs --adoption
      default-branch: main
      merge: true
    secrets: inherit
