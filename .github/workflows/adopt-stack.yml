name: Adopt stack

# Adopts each new @tangle-network release through agent-eval's reusable
# workflow, which owns the pinning, peer-range widening and PR rules.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@97099c2bee8a59f2d998a640b581ba05ebdf0cc6
    with:
      stack-ref: 97099c2bee8a59f2d998a640b581ba05ebdf0cc6
      gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
      post-pin: node scripts/release-notes.mjs --adoption
      default-branch: main
      merge: true
    secrets: inherit
