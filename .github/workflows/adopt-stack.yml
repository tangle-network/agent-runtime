name: Adopt stack

# Adopts each new @tangle-network release through agent-eval's reusable
# workflow, which owns the pinning, peer-range widening and PR rules.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@9509f8a89a1f13631609d571c3f299f91bf61794
    with:
      stack-ref: 9509f8a89a1f13631609d571c3f299f91bf61794
      gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
      post-pin: node scripts/release-notes.mjs --adoption
      default-branch: main
      merge: true
    secrets: inherit
