name: Adopt stack

# Adopts each new @tangle-network release through agent-eval's reusable
# workflow, which owns the pinning, peer-range widening and PR rules.
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@d1e0b6ced9543ac287e7f9cc457920439363c638
    with:
      stack-ref: d1e0b6ced9543ac287e7f9cc457920439363c638
      gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test
      post-pin: node scripts/release-notes.mjs --adoption-note
      default-branch: main
      merge: true
    secrets: inherit
