name: Adopt stack

# Adopts each new @tangle-network release through agent-eval's reusable
# workflow, which owns the pinning, peer-range widening and PR rules.
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@29aa169723c241d9093704ca9da6b47eab819f65
    with:
      stack-ref: 29aa169723c241d9093704ca9da6b47eab819f65
      gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
      post-pin: node scripts/release-notes.mjs --adoption
      default-branch: main
      merge: true
    secrets: inherit
