name: Adopt stack

# Adopts each new @tangle-network release through agent-eval's reusable
# workflow, which owns the pinning, peer-range widening and PR rules.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@28e93616e223e5ee3159527ffe03b0c84bb6ddb5
    with:
      stack-ref: 28e93616e223e5ee3159527ffe03b0c84bb6ddb5
      gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
      post-pin: node scripts/release-notes.mjs --adoption
      default-branch: main
      merge: true
    secrets: inherit
