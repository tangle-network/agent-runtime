name: Adopt stack

on:
  workflow_dispatch:
    inputs:
      merge:
        description: Merge the adoption PR when its gate passes
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@aa7158aad768ee59647472d96c9b1b8b0aa3cf1c
    with:
      stack-ref: aa7158aad768ee59647472d96c9b1b8b0aa3cf1c
      gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
      post-pin: node scripts/release-notes.mjs --adoption
      default-branch: main
      merge: ${{ inputs.merge }}
    secrets: inherit
